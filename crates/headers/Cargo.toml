[package]
name = "lean-rust-core-headers"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/lean-rust-core-headers"
repository = "https://github.com/mjgil/lean-rust-gen"
homepage = "https://github.com/mjgil/lean-rust-gen"
readme = "README.md"
description = "C header generation helpers for LeanRustCore ABI exports"
keywords = ["lean", "rust", "headers", "ffi"]
categories = ["api-bindings", "development-tools", "compilers"]

[lib]
name = "lean_rust_core_headers"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
