[package]
name = "lean-rust-core-validate"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/lean-rust-core-validate"
repository = "https://github.com/mjgil/lean-rust-gen"
homepage = "https://github.com/mjgil/lean-rust-gen"
readme = "README.md"
description = "Validation helpers for LeanRustCore generated artifacts"
keywords = ["lean", "rust", "validation", "codegen"]
categories = ["compilers", "development-tools", "parser-implementations"]

[lib]
name = "lean_rust_core_validate"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }

[package.metadata.docs.rs]
all-features = true
