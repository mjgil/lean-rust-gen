[package]
name = "lean-rust-core-generated"
version = "0.2.0"
edition = "2021"
build = "build.rs"
license = "MIT OR Apache-2.0"

[lib]
name = "lean_rust_core_generated"
path = "src/lib.rs"

[features]
default = []
ffi = ["dep:lean-rust-core-abi"]

[dependencies]
num-bigint = "0.4"
lean-rust-core-runtime = { path = "../crates/runtime" }
lean-rust-core-abi = { path = "../crates/abi", optional = true }

[dev-dependencies]
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
