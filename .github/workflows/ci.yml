name: lean-rust-core

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup Lean
        uses: leanprover/lean-action@v1
      - name: Check
        run: ./scripts/check.sh
