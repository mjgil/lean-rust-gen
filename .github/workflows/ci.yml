name: lean-rust-core

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.0
      - name: Setup Lean
        uses: leanprover/lean-action@v1
      - name: Check
        run: ./scripts/check.sh
