name: lean-rust-core

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust_features: [default, ffi]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.0
      - name: Setup Lean
        uses: leanprover/lean-action@v1
      - name: Run scripted CI lane
        run: ./scripts/check-ci-e2e.sh ${{ matrix.rust_features }}
